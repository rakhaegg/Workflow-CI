name: retrain_and_docker

on:
  push:
    branches: [ main ]
    paths: [ 'MLProject/**' ]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/demand-forecast:latest
      GDRIVE_FOLDER: ${{ secrets.DRIVE_FOLDER_ID }}


    steps:
    # 1.  Checkout repo
    - uses: actions/checkout@v3

    # 2.  Setup Python 3.12.7
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v5
      with:
        python-version: "3.12.7"

    # 3.  Check Env
    - name: Check Env
      run: |
        python -V
        echo "Runner: $RUNNER_OS $RUNNER_ARCH"

    # 4.  Install dependencies once (pip)
    - name: Install dependencies
      run: |
        pip install -r MLProject/requirements.txt

    # 5.  Run MLflow Project using *local* env  ←  ⏩ TANPA Conda ⏩
    - name: Run mlflow project
      run: |
        cd MLProject
        mlflow run . -P num_boost_round=300 --env-manager=local

    # 6.  Locate latest model artefact
    - name: Get latest MLflow run_id
      id: getrun
      run: |
        RUN_DIR=$(ls -td MLProject/mlruns/*/* | head -n1)
        echo "run_dir=$RUN_DIR" >> $GITHUB_OUTPUT
        echo "model_path=$(find $RUN_DIR/artifacts/model -name '*.json' | head -n1)" >> $GITHUB_OUTPUT
        echo "enc_path=$(find $RUN_DIR/artifacts/model -name '*encoder.pkl' | head -n1)" >> $GITHUB_OUTPUT

    # 7.  Upload ke Google Drive
    - name: Install gdrive
      run: |
        # unduh BINARY langsung (± 3 MB)
        curl -L https://github.com/prasmussen/gdrive/releases/download/2.1.0/gdrive-linux-x64 \
         -o /usr/local/bin/gdrive
        chmod +x /usr/local/bin/gdrive
    # asdas
    # simpan Service‑Account JSON
      echo "$GDRIVE_SERVICE_JSON" > /tmp/sa.json
      env:
        GDRIVE_SERVICE_JSON: ${{ secrets.GDRIVE_SERVICE_JSON }}

    - name: Upload artefact to Drive
      env:
        FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      run: |
        /usr/local/bin/gdrive --service-account /tmp/sa.json files upload \
          --parent "$FOLDER_ID" "${{ steps.getrun.outputs.model_path }}"

    # 8.  Build Docker image berisi model
    - name: Build Docker image
      run: |
        mkdir docker_ctx
        cp Monitoring\ dan\ Logging/7.inference.py docker_ctx/
        cp "${{ steps.getrun.outputs.model_path }}" docker_ctx/xgb_gpu.json
        cp "${{ steps.getrun.outputs.enc_path }}" docker_ctx/ohe_encoder.pkl
        cat <<'EOF' > docker_ctx/Dockerfile
        FROM python:3.12-slim
        WORKDIR /app
        COPY . /app
        RUN pip install fastapi uvicorn[standard] xgboost==2.0.* scikit-learn==1.5.* pandas==2.2.* joblib==1.4.*
        EXPOSE 8000
        CMD ["uvicorn", "inference:app", "--host", "0.0.0.0", "--port", "8000"]
        EOF
        docker build -t $IMAGE_NAME docker_ctx

    # 9.  Push ke Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      run: docker push $IMAGE_NAME
