name: retrain_and_docker

on:
  push:
    branches: [ main ]
    paths: [ 'MLProject/**' ]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/demand-forecast:latest

    steps:
    # 1️⃣  Checkout
    - uses: actions/checkout@v3

    # 2️⃣  Micromamba + env dari conda.yaml
    - name: Setup micromamba
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-file: MLProject/conda.yaml
        init-shell: bash    # ← tambahkan ke ~/.bashrc
        cache-downloads: true
        cache-env: true

    # 3️⃣  Check env
    - name: Check Env
      shell: bash -l {0}
      run: |
        echo "✔ python=$(python -V)"
        echo "✔ which conda=$(which micromamba || true)"
        conda list | head -n 5

    # 4️⃣  Set MLflow Tracking URI (local)
    - name: Set MLflow Tracking URI
      shell: bash -l {0}
      run: echo "MLFLOW_TRACKING_URI=file:./mlruns" >> "$GITHUB_ENV"

    # 5️⃣  Run mlflow project  (shell login -l penting!)
    - name: Run mlflow project
      shell: bash -l {0}
      run: |
        cd MLProject
        mlflow run . -P num_boost_round=300

    # 6️⃣  Grab latest artefact path
    - name: Get latest MLflow run_id
      id: getrun
      shell: bash -l {0}
      run: |
        RUN_DIR=$(ls -td MLProject/mlruns/*/* | head -n1)
        echo "run_dir=$RUN_DIR" >> $GITHUB_OUTPUT
        echo "model_path=$(find $RUN_DIR/artifacts/model -name '*.json' | head -n1)" >> $GITHUB_OUTPUT
        echo "enc_path=$(find $RUN_DIR/artifacts/model -name '*encoder.pkl' | head -n1)" >> $GITHUB_OUTPUT

    # 7️⃣  Upload ke Google Drive
    - name: Install uploader deps & upload
      shell: bash -l {0}
      env:
        GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      run: |
        pip install --quiet gdown
        gdown --folder $GDRIVE_TOKEN --upload \
              "${{ steps.getrun.outputs.model_path }}" \
              --parent <DRIVE_FOLDER_ID>

    # 8️⃣  Build Docker
    - name: Build Docker image
      shell: bash -l {0}
      run: |
        mkdir docker_ctx
        cp Monitoring\ dan\ Logging/7.inference.py docker_ctx/
        cp "${{ steps.getrun.outputs.model_path }}" docker_ctx/xgb_gpu.json
        cp "${{ steps.getrun.outputs.enc_path }}"  docker_ctx/ohe_encoder.pkl
        cat <<'EOF' > docker_ctx/Dockerfile
        FROM python:3.12-slim
        WORKDIR /app
        COPY . /app
        RUN pip install fastapi uvicorn[standard] xgboost==2.0.* scikit-learn==1.5.* pandas==2.2.* joblib==1.4.*
        EXPOSE 8000
        CMD ["uvicorn", "inference:app", "--host", "0.0.0.0", "--port", "8000"]
        EOF
        docker build -t $IMAGE_NAME docker_ctx

    # 9️⃣  Login & push DockerHub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image
      run: docker push $IMAGE_NAME
